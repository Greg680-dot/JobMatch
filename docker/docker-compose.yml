version: '3.8'

services:
  # 1. Base de données PostgreSQL avec extension pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobmatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jobmatch_ai}
      POSTGRES_USER: ${DB_USERNAME:-jobmatch_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobmatch_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jobmatch_user} -d ${DB_DATABASE:-jobmatch_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Broker de files d'attente et cache Redis
  redis:
    image: redis:7-alpine
    container_name: jobmatch_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Microservice Python (FastAPI + Ingestion + Matching IA)
  ai-service:
    build:
      context: ../ai-service
      dockerfile: ../docker/Dockerfile.ai-service
    container_name: jobmatch_ai_service
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${DB_USERNAME:-jobmatch_user}:${DB_PASSWORD:-jobmatch_secure_pass_2026}@postgres:5432/${DB_DATABASE:-jobmatch_ai}
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - FRANCE_TRAVAIL_CLIENT_ID=${FRANCE_TRAVAIL_CLIENT_ID:-}
      - FRANCE_TRAVAIL_CLIENT_SECRET=${FRANCE_TRAVAIL_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Application Web Laravel 11 + Vue.js 3
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: jobmatch_backend
    restart: unless-stopped
    environment:
      - APP_NAME="JobMatch AI"
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-http://localhost:8080}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-jobmatch_ai}
      - DB_USERNAME=${DB_USERNAME:-jobmatch_user}
      - DB_PASSWORD=${DB_PASSWORD:-jobmatch_secure_pass_2026}
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - AI_SERVICE_URL=http://ai-service:8000
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
